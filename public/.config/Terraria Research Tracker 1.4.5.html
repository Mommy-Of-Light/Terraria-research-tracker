<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Journey Research Tracker</title>

    <style>
        body {
            background: #1c1f2e;
        }

        .container {
            margin: 40px auto;
            font-family: "Courier New", monospace;
            color: #e6e6e6;
        }

        #viewStyleBox {
            margin-left: 10px;
            margin-right: 10px;
        }

        button {
            font-family: inherit;
            padding: 8px 16px;
            border: 2px solid #7aa2ff;
            background: linear-gradient(#3b3f55, #2a2d3d);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a1c28;
        }

        button:hover:not(:disabled) {
            border-color: #ffe66d;
        }

        h2 {
            text-align: center;
            margin: 18px 0 10px;
            color: #ffe66d;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 10px;
        }

        .item-list li {
            background: linear-gradient(#3b3f55, #2a2d3d);
            border: 2px solid #7aa2ff;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 6px;
            box-shadow: 0 3px 0 #1a1c28;
        }

        .item-list li:hover {
            border-color: #ffe66d;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .item-meta {
            font-size: 0.85rem;
            color: #9ad1ff;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
            margin-bottom: 14px;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            /* margin-top: 10px; */
            margin-bottom: 10px;
        }

        .vertical-divider {
            content: "";
            display: inline-block;
            width: 1px;
            height: 100%;
            background-color: #7aa2ff;
            margin-left: 8px;
            margin-right: 8px;
            vertical-align: middle;
        }

        #viewStyleBox button.active {
            border-color: #ffe66d;
            color: #ffe66d;
        }

        .item-list.list li {
            margin-bottom: 6px;
        }

        .item-list.grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }

        .item-list.grid li {
            height: 90px;
            padding: 6px;
            text-align: center;
        }

        .item-slot-name {
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        .item-slot-meta {
            font-size: 0.7rem;
            color: #9ad1ff;
        }

        .page-size {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .page-size select {
            font-family: inherit;
            background: #2a2d3d;
            color: #fff;
            border: 2px solid #7aa2ff;
            padding: 2px 6px;
        }

        .page-size select:hover {
            border-color: #ffe66d;
        }

        .item-status-green {
            border-color: #4caf50 !important;
        }

        .item-status-yellow {
            border-color: #f1c40f !important;
        }

        .item-status-red {
            border-color: #e74c3c !important;
        }

        .filter {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        #searchInput {
            background: #2a2d3d;
            border: 2px solid #7aa2ff;
            color: #fff;
            padding: 4px 6px;
            width: 160px;
            font-family: inherit;
        }

        #searchInput::placeholder {
            color: #aaa;
        }

        #sortSelect {
            background: #2a2d3d;
            border: 2px solid #7aa2ff;
            color: #fff;
            padding: 4px 6px;
            font-family: inherit;
        }

        #searchInput:focus,
        #sortSelect:hover {
            border-color: #ffe66d;
        }

        #summary {
            margin: 12px;
            text-align: center;
        }

        .summary-text {
            margin-bottom: 6px;
            font-weight: bold;
            color: #ffe66d;
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: #2a2d3d;
            border: 2px solid #7aa2ff;
            border-radius: 6px;
            overflow: hidden;
            margin: 4px;
        }

        .progress-bar {
            height: 100%;
            background: #4caf50;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-percent {
            font-size: 0.85rem;
            color: #9ad1ff;
        }
    </style>
</head>

<body>
    <div class="terraria container">
        <div class="toolbar" id="toolbar">
            <div>
                <input type="file" id="fileInput" hidden />
                <button id="loadBtn">Load Player File</button>
            </div>

            <span id="toolbarMenu" class="hidden toolbar">
                <div class="vertical-divider"></div>


                <div id="viewStyleBox">
                    <button id="listButton" data-view="list" class="active">List</button>
                    <button id="gridButton" data-view="grid">Grid</button>
                </div>
                <div class="vertical-divider"></div>

                <label id="pageSizeLabel" class="page-size">
                    Items:
                    <select id="pageSizeSelect">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </label>
                <div class="vertical-divider"></div>

                <label id="filterLabel" class="filter">
                    <input type="checkbox" id="filterIncomplete" checked />
                    Not fully researched
                </label>
                <div class="vertical-divider"></div>
                <input type="text" id="searchInput" placeholder="Search name or ID" />

                <div class="vertical-divider"></div>
                <select id="sortSelect">
                    <option value="id">Sort: ID</option>
                    <option value="name">Sort: Name</option>
                </select>
            </span>
        </div>

        <h2 id="playerName" class="hidden"></h2>

        <div id="summary" class="hidden">
            <div class="summary-text">
                Total: <span id="totalItems">0</span> |
                Researched: <span id="researchedItems">0</span> |
                Missing: <span id="missingItems">0</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>

        <ul id="itemList" class="item-list hidden"></ul>

        <div class="pagination hidden">
            <button id="prevBtn">◄</button>
            <span id="pageInfo"></span>
            <button id="nextBtn">►</button>
        </div>
    </div>

    <script>
        class BinaryReader {
            constructor(bytes) {
                this.bytes = bytes;
                this.offset = 0;
            }

            getBuffer(from) {
                return this.bytes.slice(from)
            }

            getOffset() {
                return this.offset
            }

            readInt32() {
                const v =
                    this.bytes[this.offset] |
                    (this.bytes[this.offset + 1] << 8) |
                    (this.bytes[this.offset + 2] << 16) |
                    (this.bytes[this.offset + 3] << 24);
                this.offset += 4;
                return v;
            }

            readInt64() {
                let v = 0n;
                for (let i = 0; i < 8; i++) {
                    v |= BigInt(this.bytes[this.offset + i]) << (8n * BigInt(i));
                }
                this.offset += 8;

                // Convert to signed if MSB is set
                if (v & (1n << 63n)) {
                    v = v - (1n << 64n);
                }
                return v;
            }

            readUInt32() {
                const v =
                    (this.bytes[this.offset]) |
                    (this.bytes[this.offset + 1] << 8) |
                    (this.bytes[this.offset + 2] << 16) |
                    (this.bytes[this.offset + 3] << 24);
                this.offset += 4;
                return v >>> 0; // force unsigned
            }

            readUInt64() {
                let result = 0n;
                for (let i = 0; i < 8; i++) {
                    result |= BigInt(this.bytes[this.offset + i]) << (8n * BigInt(i));
                }
                this.offset += 8;
                return result;
            }

            readSingle() {
                const view = new DataView(this.bytes.buffer, this.offset, 4);
                const v = view.getFloat32(0, true);
                this.offset += 4;
                return v;
            }

            readByte() {
                return this.bytes[this.offset++];
            }

            readBoolean() {
                return this.readByte() !== 0;
            }

            readString() {
                let length = 0;
                let shift = 0;
                let b;

                do {
                    b = this.readByte();
                    length |= (b & 0x7f) << shift;
                    shift += 7;
                } while (b & 0x80);

                const strBytes = this.bytes.slice(this.offset, this.offset + length);
                this.offset += length;
                return new TextDecoder("utf-8").decode(strBytes);
            }

            readRGB() {
                const r = this.readByte()
                const g = this.readByte()
                const b = this.readByte()
                return (
                    "#" +
                    r.toString(16).padStart(2, "0") +
                    g.toString(16).padStart(2, "0") +
                    b.toString(16).padStart(2, "0")
                )
            }
        }

        );

        function utf16leBytes(str) {
            const bytes = new Uint8Array(str.length * 2);
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i);
                bytes[i * 2] = code & 0xff;
                bytes[i * 2 + 1] = code >> 8;
            }
            return bytes;
        }

        const ENCRYPTION_KEY = utf16leBytes("h3y_gUyZ");

        let items = [];
        let currentPage = 1;
        let pageSize = 25
        const pageSizeSelect = document.getElementById("pageSizeSelect");
        pageSizeSelect.value = pageSize

        let showOnlyIncomplete = true

        let sortBy = "id"

        pageSizeSelect.onchange = () => {
            pageSize = Number(pageSizeSelect.value)
            currentPage = 1
            render()
        }

        filterCheckbox.onchange = () => {
            showOnlyIncomplete = filterCheckbox.checked
            currentPage = 1
            render()

        searchInput.oninput = () => {

            currentPage = 1;
            render();

        sortSelect.onchange = () => {

            const file = fileInput.files[0];
            if (!file) return;


            const encrypted = await file.arrayBuffer();
            const decrypted = await decrypt(encrypted);

            const reader = new BinaryReader(new Uint8Array(decrypted));

            const release = reader.readInt32();

            const metadata = readMetadata(reader, FileType.Player) // ignored for now

            const result = await deserialize(reader, release)

            playerNameEl.textContent = `Player: ${result.name}`
            items = result.researchProgress.items

            currentPage = 1
            render()
        })

            itemListEl.innerHTML = ""

            let visibleItems = items

            if (showOnlyIncomplete) {
                visibleItems = visibleItems.filter(i => !i.fullyResearched)
            }

            if (searchQuery) {
                visibleItems = visibleItems.filter(i =>
                    i.name.toLowerCase().includes(searchQuery) ||
                    i.internalName.toLowerCase().includes(searchQuery) ||
                    String(i.id).includes(searchQuery)
                )
            }

            visibleItems = [...visibleItems].sort((a, b) => {
                if (sortBy === "id") {
                    return a.id - b.id
                }
                return a.name.localeCompare(b.name)
            })

            const totalCount = items.length;
            const researchedCount = items.filter(i => i.fullyResearched).length;
            const missingCount = totalCount - researchedCount;
            const percent = totalCount === 0 ? 0 : Math.round((researchedCount / totalCount) * 100);

            document.getElementById("summary").classList.remove("hidden");
            document.getElementById("totalItems").textContent = totalCount;
            document.getElementById("researchedItems").textContent = researchedCount;
            document.getElementById("missingItems").textContent = missingCount;
            document.getElementById("progressBar").style.width = percent + "%";
            document.getElementById("progressPercent").textContent = percent + "%";

            const start = (currentPage - 1) * pageSize
            const pageItems = visibleItems.slice(start, start + pageSize)

            for (const item of pageItems) {
                const li = document.createElement("li")

                if (item.fullyResearched) {
                    li.classList.add("item-status-green")
                } else if (item.researched > 0) {
                    li.classList.add("item-status-yellow")
                } else {
                    li.classList.add("item-status-red")
                }

                if (viewStyle === "list") {
                    li.innerHTML = `
        <div class="item-header">
          <span>${item.name}</span>
          <span>ID: ${item.id}</span>
        </div>
        <div class="item-meta">
          Researched: ${item.researched}
        </div>
        <div class="item-meta">
          Needed: ${item.neededForResearch}
        </div>
        <div class="item-meta">
            <img src="https://terraria.wiki.gg/images/5/5b/Iron_Pickaxe.png" alt="Iron Pickaxe" width="64">
        </div>
        `
                } else {
                    li.innerHTML = `
            <div class="item-slot-name">${item.name}</div>
            <div class="item-slot-meta">ID: ${item.id}</div>
            <div class="item-slot-meta">Researched: ${item.researched}</div>
            <div class="item-slot-meta">Needed: ${item.neededForResearch}</div>
            `
                }

                itemListEl.appendChild(li)
            }

            const totalPages = Math.max(1, Math.ceil(visibleItems.length / pageSize))
            pageInfo.textContent = `Page ${currentPage} / ${totalPages}`

            prevBtn.disabled = currentPage === 1
            nextBtn.disabled = currentPage === totalPages
        }

        prevBtn.onclick = () => {
            if (currentPage > 1) {
                currentPage--
                render()
            }
        }

        nextBtn.onclick = () => {
            if (currentPage < Math.ceil(items.length / pageSize)) {
                currentPage++
                render()
            }
        }

        toolbar.addEventListener("click", (e) => {
            if (!e.target.dataset.view) return
            viewStyle = e.target.dataset.view
            if (viewStyle == "list") {
                listButton.classList.toggle("active", true)
                gridButton.classList.toggle("active", false)
            } else if (viewStyle == "grid") {
                gridButton.classList.toggle("active", true)
                listButton.classList.toggle("active", false)
            }
            render()
        })

        async function decrypt(data) {
            const key = await crypto.subtle.importKey(
                "raw",
                ENCRYPTION_KEY,
                { name: "AES-CBC" },
                false,
                ["decrypt"]
            );

            return crypto.subtle.decrypt(
                {
                    name: "AES-CBC",
                    iv: ENCRYPTION_KEY
                },
                key,
                data
            );
        }

        async function deserialize(fileIO, release) {
            const newPlayer = {}

            newPlayer.name = fileIO.readString()

            if (release >= 10) {
                if (release >= 17) {
                    newPlayer.difficulty = fileIO.readByte()
                } else if (fileIO.readBoolean()) {
                    newPlayer.difficulty = 2
                }
            }

            if (release >= 138) {
                const ticks = fileIO.readInt64()
                newPlayer.playTime = timeSpanFromTicks(ticks)
            } else {
                newPlayer.playTime = timeSpanFromTicks(0n)
            }

            newPlayer.hair = fileIO.readInt32()
            if (newPlayer.hair >= 228)
                newPlayer.hair = 0
            if (release >= 82)
                newPlayer.hairDye = fileIO.readByte()
            if (release >= 283)
                newPlayer.team = fileIO.readByte()

            newPlayer.hideVisibleAccessory = []
            if (release >= 124) {
                const bitsByte1 = byteToBits(fileIO.readByte())
                for (let key = 0; key < 8; ++key)
                    newPlayer.hideVisibleAccessory[key] = bitsByte1[key]
                const bitsByte2 = byteToBits(fileIO.readByte())
                for (let key = 0; key < 2; ++key)
                    newPlayer.hideVisibleAccessory[key + 8] = bitsByte2[key]
            } else if (release >= 83) {
                bitsByte = byteToBits(fileIO.readByte())
                for (let key = 0; key < 8; ++key)
                    newPlayer.hideVisibleAccessory[key] = bitsByte[key]
            }

            if (release >= 119)
                newPlayer.hideMisc = byteToBits(fileIO.readByte())

            if (release <= 17)
                newPlayer.Male = newPlayer.hair != 5 && newPlayer.hair != 6 && newPlayer.hair != 9 && newPlayer.hair != 11
            else if (release < 107)
                newPlayer.Male = fileIO.readBoolean()
            else
                newPlayer.skinVariant = fileIO.readByte()

            if (release < 161 && newPlayer.skinVariant == 7)
                newPlayer.skinVariant = 9

            newPlayer.statLife = fileIO.readInt32()
            newPlayer.statLifeMax = fileIO.readInt32()
            if (newPlayer.statLifeMax > 500)
                newPlayer.statLifeMax = 500

            newPlayer.statMana = fileIO.readInt32()
            newPlayer.statManaMax = fileIO.readInt32()
            if (newPlayer.statManaMax > 200)
                newPlayer.statManaMax = 200
            if (newPlayer.statMana > 400)
                newPlayer.statMana = 400

            if (release >= 125)
                newPlayer.extraAccessory = fileIO.readBoolean()

            if (release >= 229) {
                newPlayer.unlockedBiomeTorches = fileIO.readBoolean()
                newPlayer.usingBiomeTorches = fileIO.readBoolean()
                if (release >= 256)
                    newPlayer.ateArtisanBread = fileIO.readBoolean()
                if (release >= 260) {
                    newPlayer.usedAegisCrystal = fileIO.readBoolean()
                    newPlayer.usedAegisFruit = fileIO.readBoolean()
                    newPlayer.usedArcaneCrystal = fileIO.readBoolean()
                    newPlayer.usedGalaxyPearl = fileIO.readBoolean()
                    newPlayer.usedGummyWorm = fileIO.readBoolean()
                    newPlayer.usedAmbrosia = fileIO.readBoolean()
                }
            }

            if (release >= 182)
                newPlayer.downedDD2EventAnyDifficulty = fileIO.readBoolean()

            if (release >= 128)
                newPlayer.taxMoney = fileIO.readInt32()

            if (release >= 254)
                newPlayer.numberOfDeathsPVE = fileIO.readInt32()

            if (release >= 254)
                newPlayer.numberOfDeathsPVP = fileIO.readInt32()

            newPlayer.hairColor = fileIO.readRGB()
            newPlayer.skinColor = fileIO.readRGB()
            newPlayer.eyeColor = fileIO.readRGB()
            newPlayer.shirtColor = fileIO.readRGB()
            newPlayer.underShirtColor = fileIO.readRGB()
            newPlayer.pantsColor = fileIO.readRGB()
            newPlayer.shoeColor = fileIO.readRGB()

            if (release >= 38) {
                if (release < 124) {
                    let num = 11
                    if (release >= 81)
                        num = 16
                    for (let index1 = 0; index1 < num; ++index1) {
                        let index2 = index1
                        if (index2 >= 8)
                            index2 += 2
                        fileIO.readInt32() // skip
                        fileIO.readByte() // skip
                    }
                } else {
                    let num = 20
                    for (let index = 0; index < num; ++index) {
                        fileIO.readInt32() // skip
                        fileIO.readByte() // skip
                    }
                }

                if (release >= 47) {
                    let num = 3
                    if (release >= 81)
                        num = 8
                    if (release >= 124)
                        num = 10
                    for (let index3 = 0; index3 < num; ++index3) {
                        let index4 = index3
                        fileIO.readInt32() // skip
                        fileIO.readByte() // skip
                    }
                }

                if (release >= 58) {
                    for (let index = 0; index < 58; ++index) {
                        let type = fileIO.readInt32()
                        if (type >= allItemsTotal) {
                            fileIO.readInt32() // skip
                            fileIO.readByte() // skip
                            if (release >= 114)
                                fileIO.readBoolean() // skip
                        } else {
                            fileIO.readInt32() // skip
                            fileIO.readByte() // skip
                            if (release >= 114)
                                fileIO.readBoolean() // skip
                        }
                    }
                } else {
                    for (let index = 0; index < 48; ++index) {
                        let type = fileIO.readInt32()
                        if (type >= allItemsTotal) {
                            fileIO.readInt32()
                            fileIO.readByte() // skip
                        } else {
                            fileIO.readInt32()
                            fileIO.readByte()
                        }
                    }
                }

                if (release >= 117) {
                    if (release < 136) {
                        for (let index = 0; index < 5; ++index) {
                            if (index != 1) {
                                let type1 = fileIO.readInt32()
                                if (type1 >= allItemsTotal) {
                                    fileIO.readByte()
                                } else {
                                    fileIO.readByte()
                                }
                                let type2 = fileIO.readInt32()
                                if (type2 >= allItemsTotal) {
                                    fileIO.readByte()
                                } else {
                                    fileIO.readByte()
                                }
                            }
                        }
                    } else {
                        for (let index = 0; index < 5; ++index) {
                            let type3 = fileIO.readInt32()
                            if (type3 >= allItemsTotal) {
                                fileIO.readByte()
                            } else {
                                fileIO.readByte()
                            }
                            let type4 = fileIO.readInt32()
                            if (type4 >= allItemsTotal) {
                                fileIO.readByte()
                            } else {
                                fileIO.readByte()
                            }
                        }
                    }
                }

                if (release >= 58) {
                    for (let index = 0; index < 40; ++index) {
                        fileIO.readInt32()
                        fileIO.readInt32()
                        fileIO.readByte()
                    }
                    for (let index = 0; index < 40; ++index) {
                        fileIO.readInt32()
                        fileIO.readInt32()
                        fileIO.readByte()
                    }
                } else {
                    for (let index = 0; index < 20; ++index) {
                        fileIO.readInt32()
                        fileIO.readInt32()
                        fileIO.readByte()
                    }
                    for (let index = 0; index < 20; ++index) {
                        fileIO.readInt32()
                        fileIO.readInt32()
                        fileIO.readByte()
                    }
                }

                if (release >= 182) {
                    for (let index = 0; index < 40; ++index) {
                        fileIO.readInt32()
                        fileIO.readInt32()
                        fileIO.readByte()
                    }
                }

                if (release >= 198) {
                    for (let index = 0; index < 40; ++index) {
                        fileIO.readInt32()
                        fileIO.readInt32()
                        fileIO.readByte()
                        if (release >= 255)
                            fileIO.readBoolean()
                    }
                }

                if (release >= 199)
                    newPlayer.voidVaultInfo = byteToBits(fileIO.readByte())
            } else {
                // some logic for legacy stuff
            }

            if (release < 58) {
                // some inventory logic
            }

            newPlayer.buffType = []
            newPlayer.buffTime = []
            if (release >= 11) {
                let num = 22
                if (release < 74)
                    num = 10
                if (release >= 252)
                    num = 44

                for (let index = 0; index < num; ++index) {
                    newPlayer.buffType[index] = fileIO.readInt32()
                    newPlayer.buffTime[index] = fileIO.readInt32()
                    if (newPlayer.buffType[index] == 0) {
                        --index
                        --num
                    }
                }
            }

            newPlayer.spX = []
            newPlayer.spY = []
            newPlayer.spI = []
            newPlayer.spN = []
            for (let index = 0; index < 200; ++index) {
                let num = fileIO.readInt32()
                if (num != -1) {
                    newPlayer.spX[index] = num
                    newPlayer.spY[index] = fileIO.readInt32()
                    newPlayer.spI[index] = fileIO.readInt32()
                    newPlayer.spN[index] = fileIO.readString()
                } else
                    break
            }

            if (release >= 16)
                newPlayer.hbLocked = fileIO.readBoolean()

            if (release >= 115) {
                newPlayer.hideInfo = []
                let num = 13
                for (let index = 0; index < num; ++index)
                    newPlayer.hideInfo[index] = fileIO.readBoolean()
            }

            if (release >= 98) {
                newPlayer.anglerQuestsFinished = fileIO.readInt32()
            }

            if (release >= 162) {
                newPlayer.dpadRadial = {}
                newPlayer.dpadRadial.bindings = []
                for (let index = 0; index < 4; ++index)
                    newPlayer.dpadRadial.bindings[index] = fileIO.readInt32()
            }

            if (release >= 164) {
                newPlayer.builderAccStatus = []
                let num = 8
                if (release >= 167)
                    num = 10
                if (release >= 197)
                    num = 11
                if (release >= 230)
                    num = 12
                for (let index = 0; index < num; ++index)
                    newPlayer.builderAccStatus[index] = fileIO.readInt32()
                if (release < 210)
                    newPlayer.builderAccStatus[0] = 1
            }

            if (release >= 181)
                newPlayer.bartenderQuestLog = fileIO.readInt32()

            if (release >= 200) {
                newPlayer.dead = fileIO.readBoolean()
                if (newPlayer.dead)
                    newPlayer.respawnTimer = fileIO.readInt32()
            }

            newPlayer.lastTimePlayerWasSaved = "0"
            if (release >= 202)
                newPlayer.lastTimePlayerWasSaved = Number(fileIO.readInt64())

            if (release >= 206)
                newPlayer.golferScoreAccumulated = fileIO.readInt32()

            if (release >= 218)
                newPlayer.researchProgress = getResearchProgess(fileIO, release)

            return newPlayer
        }

        function getResearchProgess(reader, gameVersionSaveWasMadeOn) {
            const researchProgress = {}

            if (gameVersionSaveWasMadeOn >= 282)
                reader.readBoolean()


            let num1 = reader.readInt32()

            researchProgress.researchedAmount = num1
            researchProgress.totalAmount = allItemsTotal
            researchProgress.missingAmount = researchProgress.totalAmount - researchProgress.researchedAmount

            const allItemsCopy = structuredClone(allItems).map(item => {
                item.researched = 0
                return item
            })


            for (let index = 0; index < num1; index = ++index) {
                let key1 = reader.readString()
                let num2 = reader.readInt32()

                const item = allItemsCopy.find(item => item.internalName == key1)
                if (item) {
                    item.researched = num2
                    item.fullyResearched = num2 >= item.neededForResearch
                }
            }

            addResearchOverride(allItemsCopy)

            researchProgress.items = allItemsCopy

            return researchProgress
        }

        function addResearchOverride(items) {
            const mapping = {
                4131: [5325],
                5324: [5329, 5330],
                5437: [5358, 5359, 5360, 5361],
                4346: [5391],
                4767: [5453],
                5309: [5454],
                5323: [5455],
                5526: [2611]
            }

            const lookup = Object.fromEntries(items.map(item => [item.id, item]))

            items.forEach(item => {
                if (item.fullyResearched && mapping[item.id]) {
                    mapping[item.id].forEach(id => {
                        if (lookup[id]) {
                            lookup[id].fullyResearched = true
                        }
                    })
                }
            })
        }

        function timeSpanFromTicks(ticks) {
            return {
                ticks: ticks.toString(),
                milliseconds: Number(ticks / 10_000n),
                seconds: Number(ticks / 10_000_000n),
                minutes: Number(ticks / 600_000_000n),
                hours: Number(ticks / 36_000_000_000n),
                toString() {
                    const totalSeconds = Number(ticks / 10_000_000n);
                    const h = Math.floor(totalSeconds / 3600);
                    const m = Math.floor((totalSeconds % 3600) / 60);
                    const s = totalSeconds % 60;
                    return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
                }
            };
        }

        function byteToBits(byte) {
            const bits = []
            for (let i = 7; i >= 0; i--) {
                bits.push((byte >> 1) & 1)
            }
            return bits
        }

        function readMetadata(reader, expectedType) {
            const num1 = reader.readUInt64();

            if ((num1 & 0xFFFFFFFFFFFFFFn) !== 27981915666277746n) {
                throw new Error("Expected correct file format.");
            }

            const typeByte = Number((num1 >> 56n) & 0xFFn);
            if (!Object.values(FileType).includes(typeByte) || typeByte === FileType.None) {
                throw new Error("Found invalid file type.");
            }

            const result = {
                type: typeByte,
                typeName: FileTypeNames[typeByte],
                revision: reader.readUInt32(),
                isFavorite: (reader.readUInt64() & 1n) === 1n
            };

            if (result.type != expectedType) {
                throw new Error("Expected type " + FileTypeNames[expectedType] + " but found " + result.typeName)
            } else {
                return result
            }
        }
